audio:
  # 執行 python list_devices.py 查看設備編號
  input_device: null        # 你的真實麥克風
  output_device: null       # VB-Audio CABLE Input
  loopback_device: null     # 捕捉遊戲聲音的設備（Stereo Mix 或 VoiceMeeter 輸出）
  sample_rate: 16000
  block_size: 512

my_language: "zh"
partner_language: "en"

stt:
  model: "large-v3"
  device: "cuda"
  compute_type: "float16"

translation:
  openrouter_api_key: ""    # 留空則讀 OPENROUTER_API_KEY 環境變數
  model: "openai/gpt-4o"    # 可換 openai/gpt-4o-mini、google/gemini-flash-1.5 等
  game_context: ""          # 可填遊戲名稱，例: "StarCraft 2 strategy game"

tts:
  fish_speech_url: "http://127.0.0.1:8080"
  reference_audio: "reference.wav"
  reference_text: ""

vad:
  threshold: 0.5
  min_speech_ms: 300
  min_silence_ms: 700
  max_speech_ms: 30000

hotkeys:
  pause_toggle: "f9"        # F9 暫停/繼續發送管道
  push_to_talk: null        # null = VAD 模式；設為 "caps_lock"、"f8"、"x" 等啟用 PTT

ui:
  font_size: 18
  opacity: 0.85
  no_ui: false              # true = 停用字幕視窗

debug:
  save_utterances: false    # true = 保存每句錄音與辨識文字，用於排查音訊問題
  output_dir: "debug_audio" # 保存目錄
