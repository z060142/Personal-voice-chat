[project]
name = "personal-voice-chat"
version = "0.1.0"
description = "遊戲語音即時翻譯：STT → 翻譯 → TTS"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "faster-whisper>=1.0.3",
    "silero-vad>=5.1",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "openai>=1.12.0",
    "pyyaml>=6.0.1",
    "httpx>=0.26.0",
    "pynput>=1.7.6",
]

# torch 從 PyTorch 官方 CUDA index 安裝，其餘走 PyPI
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
